[package]
name = "a9-v16"
description = "A9 Protocol v16 — Minimalist 4-contract TON architecture (standard TEP-74 Jetton + RoundController + StakeTicket)"
version = "16.1.0"
license = "MIT"

[toolchain]
acton = "1.1.0"

[contracts.JettonWallet]
display-name = "JettonWallet"
src = "contracts/jetton/JettonWallet.tolk"
depends = []

[contracts.JettonMaster]
display-name = "JettonMaster"
src = "contracts/jetton/JettonMaster.tolk"
depends = ["JettonWallet"]

[contracts.StakeTicket]
display-name = "StakeTicket"
src = "contracts/StakeTicket.tolk"
depends = []

[contracts.RoundController]
display-name = "RoundController"
src = "contracts/RoundController.tolk"
depends = ["JettonWallet", "StakeTicket"]

[test]

[fmt]
width = 100

[import-mappings]
acton = ".acton"
contracts = "contracts"
gen = "gen"
tests = "tests"
