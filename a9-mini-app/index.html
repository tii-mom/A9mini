<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F4F5F8" />
  <meta name="description" content="A9 · 财富大冒险 — 基于 TON 的全球首个涨价解锁（Price-Unlock）协议，头矿 6H 5% 止损，12H 冲价 ≥ 8/12 平分奖池，20% 秒提 + 14 天逐秒解锁（支持 3 折急提）。" />
  <meta property="og:title" content="A9 · 财富大冒险 (A9 Wealth Quest)" />
  <meta property="og:description" content="基于 TON 的涨价解锁协议，头矿 6H 5% 止损、永不爆仓，12H 冲价 ≥ 8/12 平分奖池，14 天逐秒解锁支持 3 折急提。" />
  <link rel="preconnect" href="https://telegram.org" crossorigin />
  <link rel="dns-prefetch" href="https://telegram.org" />
  <link rel="preconnect" href="https://api.a9.lat" crossorigin />
  <link rel="dns-prefetch" href="https://api.a9.lat" />
  <meta property="og:image" content="https://app.a9.lat/assets/token/a9-token-2048.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:site" content="@A9_Ton" />
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/brand/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/brand/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/brand/apple-touch-icon.png" />
  <title>A9 · 财富大冒险</title>
  <script src="./js/theme-init.js"></script>
  <!-- Telegram WebApp SDK（defer：不阻塞首屏解析，严格按文档顺序早于 module app.js 执行） -->
  <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- 首屏关键 ES 模块预加载 -->
  <link rel="modulepreload" href="./js/app.js" />
  <link rel="modulepreload" href="./js/data.js" />
  <link rel="modulepreload" href="./js/quest/stage-view.js" />
  <!-- 双端统一设计变量 + 底层弹窗兼容样式 + Quest 视图层样式 -->
  <link rel="stylesheet" href="./css/tokens.css?v=17.1-rc1" />
  <link rel="stylesheet" href="./css/components.css?v=17.1-rc1" />
  <link rel="stylesheet" href="./css/quest.css?v=17.1-rc1" />
</head>
<body class="quest-shell-active">
  <div id="tma-shell" class="tma-shell">
    <div class="liquid-ambient" aria-hidden="true"></div>

    <header id="app-header" class="app-header" data-static-shell="1">
      <div class="header-left">
        <a class="quest-brand" href="#/profile"><span class="quest-brand-mark">A9</span><span class="quest-brand-copy"><b>财富大冒险</b><small>轮次待同步</small></span></a>
      </div>
      <div class="header-right">
        <button class="wallet-pill disconnected" id="btn-wallet-pill" type="button" disabled>
          <span class="live-dot amber"></span>
          <span>连接钱包</span>
        </button>
        <a class="icon-btn" href="#/rules" aria-label="规则">?</a>
      </div>
    </header>
    <div id="ticker-bar" class="ticker-bar hidden"></div>
    <section class="realm-banner" id="realm-banner" hidden></section>
    <main id="app-main" class="app-main" role="main">
      <div class="q-view nt-static-first-paint">
        <section class="q-hero nt-boot-skeleton" aria-busy="true" aria-label="Loading current stage">
          <div class="q-hero-top">
            <span class="q-cart-tag">STAGE --</span>
            <span class="q-phase-pill">同步中…</span>
          </div>
          <div class="q-hero-label">正在同步最新轮次状态…</div>
          <div class="q-hero-count q-num">加载中…</div>
          <div class="q-hero-sub">24H 锁仓 A9 → 12H 冲价 ≥ 8/12 段 → 达标分奖，未达标自动止损退本。</div>
        </section>
        <section class="q-card">
          <div class="q-card-h">
            <h3>快捷入口</h3>
          </div>
          <div class="q-grid2">
            <a class="q-stat" href="#/rewards" style="text-decoration:none;">
              <small>金库</small>
              <b>逐秒解锁</b>
              <span>查看票据与领取</span>
            </a>
            <a class="q-stat" href="#/market" style="text-decoration:none;">
              <small>宝箱商城</small>
              <b>6 档直发</b>
              <span>保底 + 随机加赠</span>
            </a>
          </div>
        </section>
      </div>
    </main>
    <nav id="app-tabbar" class="app-tabbar" aria-label="主导航" data-static-shell="1">
      <a class="tab-item active" href="#/round" aria-current="page"><span class="tab-lbl">冲关</span></a>
      <a class="tab-item" href="#/rewards"><span class="tab-lbl">金库</span></a>
      <a class="tab-item" href="#/market"><span class="tab-lbl">宝箱</span></a>
      <a class="tab-item" href="#/team"><span class="tab-lbl">战队</span></a>
    </nav>
    <div id="toast-container" class="toast-container" aria-live="polite"></div>
    <div id="modal-root" class="modal-root hidden" role="dialog" aria-modal="true"></div>
    <div id="sim-drawer" class="sim-drawer hidden"></div>
  </div>

  <script src="./js/runtime-config.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
