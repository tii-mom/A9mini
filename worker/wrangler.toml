name = "a9mini-v15-worker"
main = "src/cf-worker.mjs"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
A9_NETWORK = "testnet"
A9_OBS_SECONDS = "86400"
A9_PROMO_USER_FEE_NANO = "60000000"
A9_PROMO_TRANSFER_GAS_NANO = "50000000"

[triggers]
crons = ["*/1 * * * *"]

[env.testnet.vars]
A9_PROTOCOL_VERSION = "v16"
A9_NETWORK = "testnet"
A9_OBS_SECONDS = "60"
A9_JETTON_MASTER_ADDRESS = "kQAUb5IE_8UdFGElDOAP3T8cEqFOUGzRLhb_gS_LeYcNpxIX"
A9_ROUND_CONTROLLER_ADDRESS = "kQC6r-aA3gUf0v3LshgTUg4idr1jsYl7K92xr6hNLXB12u4K"
A9_PROMO_HOT_WALLET_ADDRESS = "kQDNHik_ofaZns7ki5yuMYHMHODiRSs_lcTG9R5p2iyJwt4X"

[env.testnet.triggers]
crons = ["*/1 * * * *"]

[env.production]
routes = [
  { pattern = "api.a9.lat", custom_domain = true }
]

[[env.production.d1_databases]]
binding = "DB"
database_name = "a9mini-v15-prod"
database_id = "a4bb4edf-1f3c-44a2-94d7-ec73aac60bcd"

[env.production.triggers]
crons = ["*/1 * * * *"]

[env.production.vars]
A9_ENVIRONMENT = "production"
A9_PROTOCOL_VERSION = "v16"
A9_NETWORK = "mainnet"
A9_OBS_SECONDS = "86400"
TONCENTER_API_BASE = "https://toncenter.com/api/v2"
A9_PROMO_USER_FEE_NANO = "60000000"
A9_PROMO_TRANSFER_GAS_NANO = "50000000"
A9_PRESALE_RATE_A9_PER_TON = "2002"
A9_PRESALE_MIN_ORDER_TON = "5"
A9_PRESALE_MAX_ORDER_TON = "200"
A9_PRESALE_OPEN = "0"
A9_CHEST_OPEN_ENABLED = "0"
A9_BROADCAST_ENABLED = "0"
A9_REQUIRE_RUNNER_HEARTBEAT = "1"
A9_BROADCAST_WHALE_MIN_GRAM = "50"
# 发布前确认正式 Telegram Bot 用户名。
A9_PUBLIC_ORIGIN = "https://app.a9.lat"
A9_API_ORIGIN = "https://api.a9.lat"
A9_TON_PROOF_DOMAINS = "app.a9.lat"
A9_ALLOWED_ORIGINS = "https://app.a9.lat,https://a9.lat"
A9_TG_BOT_HANDLE = "A9_TonBot"
# 主网部署后填写合约与热钱包地址。
A9_JETTON_MASTER_ADDRESS = ""
A9_ROUND_CONTROLLER_ADDRESS = ""
A9_PROMO_HOT_WALLET_ADDRESS = ""
A9_PRESALE_HOT_WALLET_ADDRESS = ""

# ---------------------------------------------------------------------------
# v16 隔离候选测试网环境（显式配置 v16，现役环境默认保持 v15）
# ---------------------------------------------------------------------------
[[env.candidate.d1_databases]]
binding = "DB"
database_name = "a9mini-v16-candidate"
# 部署前替换为独立的候选测试网 D1 ID，禁止复用生产库 ID。
database_id = "REPLACE_WITH_ISOLATED_V16_CANDIDATE_D1_ID"

[env.candidate.triggers]
crons = ["*/1 * * * *"]

[env.candidate.vars]
A9_ENVIRONMENT = "candidate"
A9_PROTOCOL_VERSION = "v16"
A9_NETWORK = "testnet"
A9_OBS_SECONDS = "60"
TONCENTER_API_BASE = "https://testnet.toncenter.com/api/v2"
A9_PROMO_USER_FEE_NANO = "60000000"
A9_PROMO_TRANSFER_GAS_NANO = "50000000"
A9_PRESALE_RATE_A9_PER_TON = "2002"
A9_PRESALE_MIN_ORDER_TON = "5"
A9_PRESALE_MAX_ORDER_TON = "200"
A9_PRESALE_OPEN = "0"
A9_CHEST_OPEN_ENABLED = "0"
A9_BROADCAST_ENABLED = "0"
A9_REQUIRE_RUNNER_HEARTBEAT = "1"
A9_BROADCAST_WHALE_MIN_GRAM = "50"
A9_TG_BOT_HANDLE = "A9_TonBot"
# 第三批隔离测试网部署前填写独立测试域名、白名单、合约与专用测试热钱包地址；缺项时 Worker 显式返回 503。
A9_PUBLIC_ORIGIN = ""
A9_TON_PROOF_DOMAINS = ""
A9_ALLOWED_ORIGINS = ""
A9_JETTON_MASTER_ADDRESS = ""
A9_ROUND_CONTROLLER_ADDRESS = ""
A9_PROMO_HOT_WALLET_ADDRESS = ""
A9_PRESALE_HOT_WALLET_ADDRESS = ""
