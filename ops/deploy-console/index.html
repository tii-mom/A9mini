<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A9 v17.0 涨价解锁 · 主网 5 步部署控制台（零私钥 · 手机扫码）</title>
  <script src="/vendor/tonconnect-ui.min.js" defer></script>
  <style>
    :root {
      --bg: #F4F5F8; --card: #FFFFFF; --tray: #EAECEF; --ink: #16181F; --muted: #5A6070;
      --red: #E60012; --red-edge: #A6000D; --green: #00A859; --green-edge: #00743D;
      --gold: #A36E00; --border: #D8DCE6;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; background: var(--bg); color: var(--ink); padding: 20px 16px 64px; }
    main { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    .card { background: var(--card); border: 2px solid var(--border); border-radius: 18px; padding: 18px 20px; box-shadow: 0 3px 0 #CFD4E0; }
    .hero { border-top: 5px solid var(--red); }
    .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
    .chip { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 800; background: var(--tray); color: var(--muted); }
    .chip.green { background: #E4F7EE; color: #00743D; }
    .chip.red { background: #FDECEE; color: #B80010; }
    .chip.gold { background: #FDF3DA; color: #8A5A00; }
    h1 { margin: 4px 0 6px; font-size: 21px; font-weight: 900; }
    h2 { margin: 0 0 8px; font-size: 16px; font-weight: 800; }
    p { margin: 4px 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
    @media (max-width: 640px) { .grid-2 { grid-template-columns: 1fr; } }
    .box { background: var(--bg); border: 1.5px solid var(--border); border-radius: 12px; padding: 10px 12px; }
    .box small { display: block; color: var(--muted); font-size: 11px; font-weight: 700; }
    .box strong { display: block; font-size: 13px; margin-top: 3px; word-break: break-all; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 12px; padding: 11px 18px; font-size: 14px; font-weight: 800; cursor: pointer; transition: transform 80ms ease; }
    .btn:active:not(:disabled) { transform: translateY(2px); }
    .btn-red { background: var(--red); color: #FFF; box-shadow: 0 3px 0 var(--red-edge); }
    .btn-green { background: var(--green); color: #FFF; box-shadow: 0 3px 0 var(--green-edge); }
    .btn-sec { background: var(--tray); color: var(--ink); box-shadow: 0 2px 0 #C5CBD8; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
    .step-card { border-left: 5px solid var(--border); }
    .step-card.done { border-left-color: var(--green); }
    .step-card.active { border-left-color: var(--red); }
    .log { background: #14161D; color: #D7F9E9; border-radius: 12px; padding: 12px 14px; font-size: 12px; max-height: 180px; overflow: auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <section class="card hero">
      <div class="row">
        <div>
          <span class="chip red">A9 PROTOCOL v17.0 · PRICE-UNLOCK · TON MAINNET (-239)</span>
          <h1>主网 5 步部署控制台（电脑零私钥 · 手机扫码）</h1>
        </div>
        <div class="row">
          <button id="btn-refresh" class="btn btn-sec" type="button">刷新链上状态</button>
          <button id="btn-connect" class="btn btn-red" type="button">连接手机 W5 钱包</button>
        </div>
      </div>
      <p>所有交易 BOC 均由锁定哈希的 <code>v17/build/*.json</code> 构建并通过本地 TVM 沙盒逐位验真。电脑不存任何私钥；每一步都会强制核对主网 <code>-239</code> 与指定签名钱包地址，且只有前置步骤在主网链上确认后才解锁下一步。</p>
      <div class="grid-2" id="wallet-panel"></div>
    </section>

    <section class="card">
      <div class="row">
        <h2>已锁定的主网确定性合约地址</h2>
        <span class="chip" id="overall-chip">检测主网状态中…</span>
      </div>
      <div class="grid-2" id="contracts-panel"></div>
    </section>

    <section id="steps-container" style="display:flex;flex-direction:column;gap:12px;"></section>

    <section class="card">
      <h2>实时操作日志</h2>
      <div class="log mono" id="log-box">正在初始化控制台…</div>
    </section>
  </main>
  <script type="module" src="/console.js"></script>
</body>
</html>
